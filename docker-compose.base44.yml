services:
  web:
    image: node:22
    working_dir: /app
    command: sh -c "npm install && npx ng serve --host 0.0.0.0 --port 4200"
    volumes:
      - .:/app
      - /app/node_modules
  proxy:
    image: nginx:alpine
    volumes:
      - ./nginx.base44.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "3000:3000"
    depends_on:
      - web

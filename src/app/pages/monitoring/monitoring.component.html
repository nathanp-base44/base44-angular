<div class="-m-6 min-h-full bg-slate-950 p-6">
  <div class="mx-auto max-w-7xl space-y-6">
    <div>
      <h2 class="text-lg font-semibold text-slate-100">Infrastructure Monitoring</h2>
      <p class="text-xs text-slate-500">Fleet health, resource usage and incidents</p>
    </div>

    <div class="grid gap-4 grid-cols-2 lg:grid-cols-4">
      @for (k of kpis(); track k.label) {
        <app-metric-card [label]="k.label" [value]="k.value" [unit]="k.unit" [sub]="k.sub" [accent]="k.accent" dark />
      }
    </div>

    <div class="grid gap-6 lg:grid-cols-3">
      <div class="space-y-6 lg:col-span-2">
        <div class="grid gap-6 md:grid-cols-2">
          <app-cpu-chart [data]="cpuSamples" />
          <app-cpu-chart [data]="memorySamples" title="Memory Usage (%)" color="#a78bfa" seriesName="Memory" />
        </div>
        <app-server-table [servers]="servers" />
      </div>
      <app-alert-feed [alerts]="alerts()" [selectedId]="selectedId()" (select)="onSelect($event)" />
    </div>
  </div>

  @if (selectedAlert(); as alert) {
    <app-alert-detail [alert]="alert" (close)="onClose()" (update)="onUpdate($event)" />
  }
</div>
